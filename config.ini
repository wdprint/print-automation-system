; ============================================
;     PDF 자동화 시스템 설정 파일
; ============================================

[General]
; 알림 메시지 표시 여부 (true/false)
ShowNotifications=true

; 처리 완료/실패 시 소리 재생 여부 (true/false)
PlaySounds=true

; EXE 파일 이름 (같은 폴더에 있어야 함)
ExeName=print_automation.exe

[Hotkeys]
; 프리셋 단축키 (변경 가능)
; 형식: ! = Alt, ^ = Ctrl, + = Shift
Preset1=!q
Preset2=!w
Preset3=!e
Preset4=!r

; 프로그램 제어 단축키
Settings=!s
GUI=!g
Help=!h
Reload=!+r
Exit=!+q

[Display]
; 툴팁 표시 시간 (밀리초)
TooltipDuration=2000

; 시작 시 환영 메시지 표시
ShowWelcomeMessage=true